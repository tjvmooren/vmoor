<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>vmoor</title>
  <meta name="description" content="Projects, labs, and tools by Tyler Vander Mooren." />

  <style>
    :root {
      --bg: #0b0d12;
      --fg: #e8ebf2;
      --muted: #a8b0c2;
      --card: rgba(255, 255, 255, 0.06);
      --border: rgba(255, 255, 255, 0.12);
      --link: #8ab4ff;
      --warn: rgba(255, 201, 71, 0.9);
      --good: rgba(71, 255, 167, 0.9);
      --bad: rgba(255, 92, 92, 0.9);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, Segoe UI, Roboto;
      color: var(--fg);
      background:
        radial-gradient(1000px 500px at 20% 0%, rgba(138, 180, 255, 0.18), transparent 50%),
        var(--bg);
    }

    a { color: var(--link); text-decoration: none; }
    a:hover { text-decoration: underline; }

    h1 { font-size: clamp(34px, 5vw, 52px); margin: 0 0 14px; }
    p { max-width: 70ch; color: var(--muted); }

    .wrap { max-width: 980px; margin: auto; padding: 64px 20px; }

    header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 16px;
    }

    footer { margin-top: 48px; font-size: 13px; color: var(--muted); }
    .mono { font-family: ui-monospace, Consolas, monospace; }
    .hero { margin-top: 56px; }

    .btn {
      padding: 10px 14px;
      border-radius: 12px;
      background: var(--card);
      border: 1px solid var(--border);
      display: inline-flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
    }
    .btn:hover { border-color: rgba(255, 255, 255, 0.22); }

    .panel {
      margin-top: 20px;
      padding: 18px;
      border-radius: 16px;
      background: var(--card);
      border: 1px solid var(--border);
    }

    .panel h2 { margin: 0 0 10px; font-size: 18px; }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 10px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.03);
      font-size: 13px;
      color: var(--muted);
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: var(--warn);
      box-shadow: 0 0 18px rgba(255, 201, 71, 0.25);
    }

    /* ---------- Tabs ---------- */
    .tabs {
      display: inline-flex;
      gap: 8px;
      padding: 6px;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.03);
      margin-top: 14px;
    }

    .tab {
      appearance: none;
      border: 1px solid transparent;
      background: transparent;
      color: var(--muted);
      padding: 10px 12px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 13px;
      line-height: 1;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .tab:hover {
      color: var(--fg);
      border-color: rgba(255,255,255,0.14);
      background: rgba(255,255,255,0.03);
    }

    .tab[aria-selected="true"] {
      color: var(--fg);
      border-color: rgba(255,255,255,0.18);
      background: rgba(255,255,255,0.06);
    }

    .tab-badge {
      font-size: 12px;
      padding: 3px 8px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.14);
      color: var(--muted);
      white-space: nowrap;
    }

    /* ---------- Card grid ---------- */
    .grid {
      margin-top: 16px;
      display: grid;
      grid-template-columns: 1fr;
      gap: 14px;
    }

    .stream-card {
      padding: 14px;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px dashed rgba(255, 255, 255, 0.18);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .thumb-wrap {
      width: 100%;
      aspect-ratio: 16 / 9;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.12);
      background: linear-gradient(135deg, rgba(138,180,255,0.22), rgba(255,255,255,0.02));
    }

    .player { width: 100%; height: 100%; border: 0; display: block; }

    .stream-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
    }

    .stream-title { font-weight: 700; line-height: 1.2; }

    .badge {
      font-size: 12px;
      padding: 4px 8px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.14);
      color: var(--muted);
      white-space: nowrap;
    }

    .badge.good { border-color: rgba(71,255,167,0.35); color: rgba(200,255,225,0.95); }
    .badge.warn { border-color: rgba(255,201,71,0.35); color: rgba(255,240,210,0.95); }
    .badge.bad  { border-color: rgba(255,92,92,0.35);  color: rgba(255,220,220,0.95); }

    .stream-meta {
      color: var(--muted);
      font-size: 13px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .stream-actions {
      margin-top: auto;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
    }

    .mini-btn {
      padding: 8px 10px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.03);
      font-size: 13px;
      color: var(--fg);
      cursor: pointer;
    }

    .mini-btn:hover {
      border-color: rgba(255,255,255,0.22);
      text-decoration: none;
    }

    /* Better select readability */
    .select {
      width: 100%;
      padding: 10px 12px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: #111420;
      color: #e8ebf2;
      font-size: 14px;
      line-height: 1.3;
      outline: none;
      cursor: pointer;
    }
    .select option { background: #0b0d12; color: #e8ebf2; }
    .select:focus {
      border-color: rgba(138,180,255,0.6);
      box-shadow: 0 0 0 1px rgba(138,180,255,0.4);
    }

    label.small { display: block; margin-bottom: 6px; }
    .small { font-size: 12px; color: var(--muted); line-height: 1.35; }
    .divider { height: 1px; background: rgba(255,255,255,0.08); margin: 8px 0; }

    /* Tab content visibility */
    .tab-panel[hidden] { display: none; }
  </style>
</head>

<body>
  <div class="wrap">
    <header>
      <div><a class="mono" href="/">← vmoor</a></div>
      <a class="btn" href="#" onclick="return false;" title="API wiring later">
        <span class="mono">API</span>
        <span style="color: var(--muted); font-size: 13px;">(soon)</span>
      </a>
    </header>

    <section class="hero">
      <h1>Stream Hub</h1>

      <div class="panel">
        <div style="display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;">
          <h2>🚧 Under construction</h2>
          <span class="pill"><span class="dot"></span> In progress</span>
        </div>

        <!-- Tabs -->
        <div class="tabs" role="tablist" aria-label="Stream tabs">
          <button class="tab" role="tab" id="tab-twitch" aria-controls="panel-twitch" aria-selected="true" type="button">
            Twitch <span class="tab-badge">@simonizeshow</span>
          </button>
          <button class="tab" role="tab" id="tab-streamed" aria-controls="panel-streamed" aria-selected="false" type="button">
            Streamed <span class="tab-badge">Live Sports</span>
          </button>
        </div>

        <p style="margin-top:10px;">
          Planned: live status, title/category, viewers, and direct links.
        </p>

        <!-- Panels -->
        <div class="grid">
          <div id="panel-twitch" class="tab-panel" role="tabpanel" aria-labelledby="tab-twitch">
            <div id="twitch-slot"></div>
          </div>

          <div id="panel-streamed" class="tab-panel" role="tabpanel" aria-labelledby="tab-streamed" hidden>
            <div id="streamed-slot"></div>
          </div>
        </div>
      </div>
    </section>

    <footer><span class="mono">vmoor</span></footer>
  </div>

  <script>
    // ============================
    // CONFIG
    // ============================
    const twitch = { name: "Main Stream", platform: "Twitch", username: "simonizeshow" };

    const streamed = {
      name: "Live Sports (Streamed)",
      platform: "Streamed",
      matchesEndpoint: "https://streamed.pk/api/matches/live",
      fallbackEndpoint: "https://streamed.pk/api/matches/all-today"
    };

    // ============================
    // RENDER BOTH CARDS INTO THEIR SLOTS
    // ============================
    document.getElementById("twitch-slot").innerHTML = renderTwitchCard(twitch);
    document.getElementById("streamed-slot").innerHTML = renderStreamedCard(streamed);

    initTabs();
    initStreamedCard(streamed).catch(err => {
      setStreamedStatus("Error loading matches", "bad");
      console.error(err);
    });

    // ============================
    // TABS
    // ============================
    function initTabs() {
      const tabs = [
        { tab: document.getElementById("tab-twitch"), panel: document.getElementById("panel-twitch"), key: "twitch" },
        { tab: document.getElementById("tab-streamed"), panel: document.getElementById("panel-streamed"), key: "streamed" }
      ];

      const saved = localStorage.getItem("streamTab");
      if (saved) setActive(saved);

      tabs.forEach(t => t.tab.addEventListener("click", () => setActive(t.key)));

      function setActive(key) {
        tabs.forEach(t => {
          const active = (t.key === key);
          t.tab.setAttribute("aria-selected", String(active));
          t.panel.toggleAttribute("hidden", !active);
        });
        localStorage.setItem("streamTab", key);
      }
    }

    // ============================
    // TWITCH CARD
    // ============================
    function renderTwitchCard(c) {
      const parent = location.hostname || "localhost";
      const src = `https://player.twitch.tv/?channel=${encodeURIComponent(c.username)}&parent=${encodeURIComponent(parent)}`;

      return `
        <article class="stream-card">
          <div class="thumb-wrap">
            <iframe class="player" src="${src}" allowfullscreen scrolling="no"></iframe>
          </div>

          <div class="stream-top">
            <div class="stream-title">${escapeHtml(c.name)}</div>
            <span class="badge">${escapeHtml(c.platform)}</span>
          </div>

          <div class="stream-meta">
            <span>@${escapeHtml(c.username)}</span>
            <span>Status: embedded</span>
          </div>

          <div class="stream-actions">
            <a class="mini-btn" href="https://twitch.tv/${encodeURIComponent(c.username)}" target="_blank" rel="noopener noreferrer">
              Open on Twitch
            </a>
          </div>
        </article>
      `;
    }

    // ============================
    // STREAMED CARD
    // ============================
    function renderStreamedCard(c) {
      return `
        <article class="stream-card">
          <div class="thumb-wrap">
            <iframe class="player" id="streamed-player" src="" allowfullscreen></iframe>
          </div>

          <div class="stream-top">
            <div class="stream-title">${escapeHtml(c.name)}</div>
            <span class="badge warn" id="streamed-status">Loading…</span>
          </div>

          <div class="stream-meta" id="streamed-meta">
            <span>Match: —</span>
            <span>Source: —</span>
          </div>

          <div class="divider"></div>

          <label class="small" for="streamed-match-select">Pick a live match</label>
          <select class="select" id="streamed-match-select" disabled>
            <option>Loading matches…</option>
          </select>

          <div class="stream-actions">
            <button class="mini-btn" type="button" id="streamed-reload">Reload</button>
            <a class="mini-btn" id="streamed-open" href="#" target="_blank" rel="noopener noreferrer">Open stream</a>
          </div>

          <div class="small">If a match fails to load, try another source or reload.</div>
        </article>
      `;
    }

    async function initStreamedCard(cfg) {
      const select = document.getElementById("streamed-match-select");
      const reloadBtn = document.getElementById("streamed-reload");

      reloadBtn.addEventListener("click", async () => {
        await loadMatchesAndFirstStream(cfg);
      });

      select.addEventListener("change", async (e) => {
        const matchId = e.target.value;
        if (!matchId) return;
        await loadStreamsForMatchId(matchId);
      });

      await loadMatchesAndFirstStream(cfg);
    }

    async function loadMatchesAndFirstStream(cfg) {
      setStreamedStatus("Loading…", "warn");
      setStreamedMeta("Match: —", "Source: —");

      const select = document.getElementById("streamed-match-select");
      select.disabled = true;
      select.innerHTML = `<option>Loading matches…</option>`;

      let matches = await safeJsonFetch(cfg.matchesEndpoint);
      if (!Array.isArray(matches) || matches.length === 0) {
        matches = await safeJsonFetch(cfg.fallbackEndpoint);
      }

      if (!Array.isArray(matches) || matches.length === 0) {
        setStreamedStatus("No matches found", "bad");
        select.innerHTML = `<option>No matches available</option>`;
        return;
      }

      window.__streamedMatches = matches;

      select.innerHTML = matches.map(m => {
        const title = (m.title || "Untitled match");
        const when = m.date ? new Date(m.date).toLocaleString() : "";
        return `<option value="${escapeAttr(m.id)}">${escapeHtml(title)}${when ? " • " + escapeHtml(when) : ""}</option>`;
      }).join("");

      select.disabled = false;
      setStreamedStatus(`Loaded ${matches.length}`, "good");

      await loadStreamsForMatchId(matches[0].id);
    }

    async function loadStreamsForMatchId(matchId) {
      const matches = window.__streamedMatches || [];
      const match = matches.find(m => m.id === matchId);

      if (!match) { setStreamedStatus("Match not found", "bad"); return; }
      if (!match.sources || match.sources.length === 0) {
        setStreamedStatus("No sources for match", "bad");
        setStreamedMeta(`Match: ${match.title || "—"}`, "Source: —");
        return;
      }

      const firstSource = match.sources[0];
      const sourceName = firstSource.source;
      const sourceId = firstSource.id;

      setStreamedStatus("Loading stream…", "warn");
      setStreamedMeta(`Match: ${match.title || "—"}`, `Source: ${sourceName}`);

      const endpoint = `https://streamed.pk/api/stream/${encodeURIComponent(sourceName)}/${encodeURIComponent(sourceId)}`;
      const streams = await safeJsonFetch(endpoint);

      if (!Array.isArray(streams) || streams.length === 0) { setStreamedStatus("No streams returned", "bad"); return; }

      const best =
        streams.find(s => (s.language || "").toLowerCase().includes("english") && s.hd === true) ||
        streams.find(s => (s.language || "").toLowerCase().includes("english")) ||
        streams.find(s => s.hd === true) ||
        streams[0];

      if (!best || !best.embedUrl) { setStreamedStatus("Bad stream data", "bad"); return; }

      document.getElementById("streamed-player").src = best.embedUrl;
      const open = document.getElementById("streamed-open");
      open.href = best.embedUrl;

      setStreamedStatus(`Stream #${best.streamNo || "?"} loaded`, "good");
      setStreamedMeta(
        `Match: ${match.title || "—"}`,
        `Source: ${best.source || sourceName} • ${best.language || "?"} • ${best.hd ? "HD" : "SD"}`
      );
    }

    function setStreamedStatus(text, kind) {
      const el = document.getElementById("streamed-status");
      el.textContent = text;
      el.classList.remove("good", "warn", "bad");
      if (kind) el.classList.add(kind);
    }

    function setStreamedMeta(left, right) {
      const el = document.getElementById("streamed-meta");
      el.innerHTML = `<span>${escapeHtml(left)}</span><span>${escapeHtml(right)}</span>`;
    }

    async function safeJsonFetch(url) {
      const res = await fetch(url, { method: "GET" });
      if (!res.ok) throw new Error(`Fetch failed: ${res.status} ${res.statusText} (${url})`);
      return await res.json();
    }

    function escapeHtml(str) {
      return String(str)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#39;");
    }
    function escapeAttr(str) {
      return escapeHtml(str).replaceAll("`", "&#96;");
    }
  </script>
</body>
</html>
