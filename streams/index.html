<!doctype html>
<html lang="en">
<head>
  <!-- =====================================================
       Basic metadata
       ===================================================== -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>vmoor</title>
  <meta
    name="description"
    content="Projects, labs, and tools by Tyler Vander Mooren."
  />

  <!-- =====================================================
       Page styles
       ===================================================== -->
  <style>
    /* ---------- Theme variables ---------- */
    :root {
      --bg: #0b0d12;
      --fg: #e8ebf2;
      --muted: #a8b0c2;
      --card: rgba(255, 255, 255, 0.06);
      --border: rgba(255, 255, 255, 0.12);
      --link: #8ab4ff;
    }

    /* ---------- Global resets ---------- */
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;

      font-family: system-ui, -apple-system, Segoe UI, Roboto;
      color: var(--fg);

      background:
        radial-gradient(
          1000px 500px at 20% 0%,
          rgba(138, 180, 255, 0.18),
          transparent 50%
        ),
        var(--bg);
    }

    /* ---------- Base elements ---------- */
    a {
      color: var(--link);
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    h1 {
      font-size: clamp(34px, 5vw, 52px);
      margin: 0 0 14px;
    }

    p {
      max-width: 70ch;
      color: var(--muted);
    }

    /* ---------- Layout ---------- */
    .wrap {
      max-width: 980px;
      margin: auto;
      padding: 64px 20px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }

    footer {
      margin-top: 48px;
      font-size: 13px;
      color: var(--muted);
    }

    /* ---------- Typography helpers ---------- */
    .mono {
      font-family: ui-monospace, Consolas, monospace;
    }

    .brand {
      font-size: 22px;
      font-weight: 700;
    }

    .tag {
      font-size: 14px;
      color: var(--muted);
    }

    /* ---------- Hero section ---------- */
    .hero {
      margin-top: 56px;
    }

    .cta {
      margin-top: 20px;
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    /* ---------- Buttons ---------- */
    .btn {
      padding: 10px 14px;
      border-radius: 12px;

      background: var(--card);
      border: 1px solid var(--border);
    }

    .btn:hover {
      border-color: rgba(255, 255, 255, 0.22);
    }
  </style>
</head>
<body>
  <div class="wrap">
    <!-- =====================================================
         Header
         ===================================================== -->
    <header>
      <div>
        <a class="mono" href="/">← vmoor</a>
      </div>
      
    </header>
    <!-- =====================================================
         Hero / intro section
         ===================================================== -->
    <section class="hero">
      <h1>Stream Hub</h1>
      <p></p>


    </section>
    <!-- =====================================================
         Footer
         ===================================================== -->
    <footer>
     <span class="mono">vmoor</span>
    </footer>
  </div>
</body>
</html>
