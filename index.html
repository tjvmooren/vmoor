<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>vmoor</title>
  <meta
    name="description"
    content="Projects, labs, and tools by Tyler Vander Mooren."
  />
  <link rel="stylesheet" href="/assets/css/site.css">
</head>
<body>
  <div class="wrap">
    <!-- =====================================================
         Header
         ===================================================== -->
    <header>
      <div>
        <div class="brand mono">vmoor.com</div>
        <div class="tag">Projects • Labs • Tools</div>
      </div>

      <div class="row">
      <span
        id="hubStatus"
        class="pill mono"
        title="Streaming Hub status (tokeo3 backend)"
        aria-live="polite"
      >
        <span id="hubDot" class="dot" aria-hidden="true"></span>
        <span id="hubText">Hub: offline</span>
      </span>
    </div>
    </header>
    <!-- =====================================================
         Hero / intro section
         ===================================================== -->
    <section class="hero">
      <h1>Main Hub</h1>
      <p></p>

      <div class="cta">
        <a class="btn" href="/sleeper"> Sleeper Dashboard</a>
        <a class="btn" href="/streams" data-hub hidden> Streams</a>
        <a class="btn" href="anime.html"> Anime </a>
        <a
          class="btn"
          href="https://github.com/tjvmooren?tab=repositories"
          target="_blank"
          rel="noopener"
        >
          ↗ GitHub
        </a>
      </div>
    </section>
    <!-- =====================================================
         Footer
         ===================================================== -->
    <footer>
     <span class="mono">vmoor</span>
    </footer>
  </div>
  <script src="assets/js/health-hub.js" defer></script>

</html>
